<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TillGuard, merchant desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">T</span>
        <div>
          <h1>TillGuard</h1>
          <p class="tag">AI clerk for PayPal, with hard policy limits</p>
        </div>
      </div>
      <div class="top-meta">
        <span id="mode-badge" class="badge">...</span>
        <span id="model-badge" class="badge quiet">model</span>
        <button type="button" id="walkthrough-btn" class="btn ghost">Load policy walkthrough</button>
        <button type="button" id="reset-btn" class="btn ghost">Reset desk</button>
      </div>
    </header>

    <main class="grid">
      <section class="chat-col">
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <div class="prompts" id="prompts"></div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="message">Message for TillGuard</label>
          <textarea id="message" rows="2" placeholder="Ask the clerk to invoice, capture, or refund. Policy is enforced in code, not just in the prompt." required></textarea>
          <button type="submit" class="btn primary" id="send-btn">Send</button>
        </form>
        <p id="status-line" class="status-line"></p>
      </section>

      <aside class="side">
        <section class="panel">
          <h2>Policy pack</h2>
          <dl id="policy-list" class="facts"></dl>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>Approval queue</h2>
            <span id="approval-count" class="count">0</span>
          </div>
          <div id="approvals" class="stack"></div>
        </section>
        <section class="panel">
          <h2>Audit log</h2>
          <div id="audit" class="stack"></div>
        </section>
        <section class="panel">
          <h2>Ledger</h2>
          <div id="ledger" class="stack"></div>
        </section>
      </aside>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
